name = "santiago-fitness-method"
compatibility_date = "2026-05-01"
pages_build_output_dir = "dist"

# La autenticación por enlace privado vive en functions/_middleware.ts.
#
# AUTH_MODE decide quién manda:
#   "access"  el middleware deja pasar; autentica Cloudflare Access (situación actual)
#   "magic"   manda el middleware: cookie de sesión o 401
#
# Si la variable falta, el middleware asume "magic" y cierra. Fallar cerrado es
# lo único aceptable en una puerta: un despliegue mal configurado deja a todo el
# mundo fuera, nunca a todo el mundo dentro.

[vars]
# Manda el middleware. Cloudflare Access ya sólo cubre /admin y los despliegues
# de rama, así que ésta es la única puerta de la app: no la pongas en "access"
# sin devolver antes Access al hostname completo, o la app quedaría abierta.
#
# Ojo: el proyecto está conectado a Git y el hostname sirve el despliegue
# canónico, que sale de un push. Esta variable sólo cuenta si está commiteada.
AUTH_MODE = "magic"

[[d1_databases]]
binding = "ACCESO"
database_name = "santiago-acceso"
database_id = "7cb38489-4054-45e9-94d9-aad9c9f533f5"

# Los despliegues de rama son el banco de pruebas del sistema nuevo antes del
# cambio en producción. Cloudflare Access sigue delante de ellos.
[env.preview.vars]
AUTH_MODE = "magic"

[[env.preview.d1_databases]]
binding = "ACCESO"
database_name = "santiago-acceso"
database_id = "7cb38489-4054-45e9-94d9-aad9c9f533f5"
