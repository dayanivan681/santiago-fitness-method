<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0d" />
    <!--
      Instalada en la pantalla de inicio abre sin la barra del navegador. iOS
      todavía lee la etiqueta propia; el resto ya usa la estándar.

      No se toca `user-scalable` ni `maximum-scale`: parecer una app no puede
      costar el zoom de quien lo necesita para leer.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS no lee el manifest: el nombre del icono sale de aquí. -->
    <meta name="apple-mobile-web-app-title" content="Santiago FM" />
    <title>Santiago Fitness Method</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
