# QA-MOB-01 y QA-MOB-02, automatizados de punta a punta.
#
# Por qué existe: los simuladores de iOS necesitan Xcode, y la máquina de
# desarrollo sólo tiene las Command Line Tools. Esto NO sustituye a Safari real
# —eso sigue pendiente— pero convierte en repetible lo que antes se comprobaba a
# mano.
#
# Qué prueba y qué NO prueba. Importa saberlo:
#
# SÍ  Que el recorrido funciona de verdad de punta a punta: enlace de acceso,
#     guardar una serie de trabajo, descanso automático, reabrir la serie con
#     "Editar", cambiar técnica, marcar calentamiento y que el descanso
#     sobreviva a salir a Biblioteca y volver. Toca los controles de verdad.
#
# NO  La geometría de QA-MOB-01. Se comprobó: reintroduciendo el fallo a
#     propósito —quitando `--alto-cronometro` de la reserva— este flujo SIGUE
#     pasando, porque Maestro desplaza el elemento a la vista antes de tocarlo y
#     la ventana de Chromium no es un viewport de móvil. Nunca llega a
#     reproducir el solapamiento.
#
#     Esa parte la protege `src/pruebas/shellMovil.test.ts`, que sí falla con el
#     fallo reintroducido. No confíes en este fichero para eso.
#
#   QA-MOB-01  Aquí: que "Editar" responde al toque con el descanso en marcha.
#   QA-MOB-02  Aquí: que Técnica y Calentamiento responden al toque.
#
# `clearState` al principio: sin él el flujo depende de lo que quedara de la
# sesión anterior, y una serie marcada como calentamiento no arranca descanso
# —comportamiento correcto— que parecería un fallo del cronómetro.
#
# El cronómetro se busca por su aria-label y no por su texto: el rótulo cambia a
# "Descanso terminado" al agotarse, y `text:` casa la cadena entera.
#
# Uso:
#   npx wrangler pages dev --port 8788 --local &
#   maestro test pruebas-maestro/qa-movil.yaml -e ENLACE=$(node pruebas-maestro/enlace-local.mjs)
url: ${ENLACE}
name: QA móvil del cliente
tags:
  - movil
  - regresion
---
- clearState
- openLink: ${ENLACE}
- assertVisible: "Tu acceso está listo"
- tapOn: "Entrar"

# La app arranca contra IndexedDB: se espera al contenido, no a un reloj fijo.
- extendedWaitUntil:
    visible: "Entrenamiento de hoy"
    timeout: 20000

# ---- Estado de partida ------------------------------------------------------
# Guardar una serie NUEVA de trabajo es lo único que arranca el descanso, y deja
# la serie recién guardada con su "Editar" justo encima de la barra.
- tapOn:
    text: "Guardar"
    index: 0
    label: Guardar la primera serie de trabajo

- extendedWaitUntil:
    visible:
      id: "Temporizador de descanso"
    timeout: 15000
    label: El descanso arranca solo al guardar una serie de trabajo

# ---- QA-MOB-01 --------------------------------------------------------------
- tapOn:
    text: "Editar"
    index: 0
    label: QA-MOB-01 · tocar Editar con el cronómetro activo

- assertVisible:
    text: "Guardar"
    label: QA-MOB-01 · el toque llegó al botón, la serie volvió a edición

- assertVisible:
    id: "Temporizador de descanso"
    label: El cronómetro sigue en marcha

# ---- QA-MOB-02 --------------------------------------------------------------
# Ambos distintivos miden 34 px de alto a la vista y amplían su zona sensible
# con un pseudo-elemento. Tocarlos prueba que la ampliación recibe el dedo.
- tapOn:
    text: "Téc. buena"
    index: 0
    label: QA-MOB-02 · tocar TÉC. BUENA

- assertVisible:
    text: "Téc. acept."
    label: QA-MOB-02 · el toque cambió la técnica de Buena a Aceptable

- tapOn:
    text: "Calent."
    index: 0
    label: QA-MOB-02 · tocar CALENT.

- assertVisible:
    text: "Calentamiento"
    label: QA-MOB-02 · la serie quedó marcada como calentamiento

# ---- El descanso sobrevive a la navegación ----------------------------------
- tapOn: "Biblioteca"
- assertVisible:
    id: "Temporizador de descanso"
    label: El descanso sigue corriendo fuera de Hoy

- tapOn: "Hoy"
- extendedWaitUntil:
    visible: "Entrenamiento de hoy"
    timeout: 15000
- assertVisible:
    id: "Temporizador de descanso"
    label: Y sigue al volver

- tapOn:
    text: "Editar"
    index: 0
    label: QA-MOB-01 · Editar sigue recibiendo el toque tras navegar
- assertVisible: "Guardar"

- takeScreenshot: qa-movil
